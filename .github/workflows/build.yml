name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.OWNFIT_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ownfit.jks"
          echo "OWNFIT_KEYSTORE=$RUNNER_TEMP/ownfit.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build release APK
        env:
          OWNFIT_KEYSTORE_PASSWORD: ${{ secrets.OWNFIT_KEYSTORE_PASSWORD }}
          OWNFIT_KEY_ALIAS: ${{ secrets.OWNFIT_KEY_ALIAS }}
          OWNFIT_KEY_PASSWORD: ${{ secrets.OWNFIT_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease -PversionCode=${{ github.run_number }} -PversionName=$VERSION
          cp app/build/outputs/apk/release/app-release.apk "OwnFit-$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ownfit-apk
          path: OwnFit-${{ env.VERSION }}.apk

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: OwnFit ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          files: OwnFit-${{ env.VERSION }}.apk
